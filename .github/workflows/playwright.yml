name: Pruebas Valkyrie Store

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

jobs:
  pruebas:
    name: Regresion automatizada
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas
        run: npm test

      - name: Conservar evidencias ante fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-playwright
          path: |
            test-results/
            playwright-report/
            evidencias/visual/
          if-no-files-found: ignore
          retention-days: 7
